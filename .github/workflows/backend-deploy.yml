name: Deploy Backend

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Check deploy secrets
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          missing=0
          for name in SSH_HOST SSH_USER SSH_PRIVATE_KEY; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing repository secret: $name"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Add secrets under Settings → Secrets and variables → Actions"
            exit 1
          fi

      - name: Setup SSH
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          # GitHub secrets often store literal "\n" instead of real newlines
          printf '%s\n' "$SSH_PRIVATE_KEY" | sed 's/\r$//' | sed 's/\\n/\n/g' > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          if ! ssh-keygen -y -f ~/.ssh/id_ed25519 >/dev/null 2>&1; then
            echo "::error::SSH_PRIVATE_KEY is invalid. Paste the full private key including BEGIN/END lines."
            exit 1
          fi

          # Prefer accept-new over fragile ssh-keyscan (often times out from GH runners)
          {
            echo "Host ${SSH_HOST}"
            echo "  HostName ${SSH_HOST}"
            echo "  IdentityFile ~/.ssh/id_ed25519"
            echo "  IdentitiesOnly yes"
            echo "  StrictHostKeyChecking accept-new"
            echo "  UserKnownHostsFile ~/.ssh/known_hosts"
            echo "  ConnectTimeout 15"
            echo "  ServerAliveInterval 15"
          } > ~/.ssh/config
          chmod 600 ~/.ssh/config
          touch ~/.ssh/known_hosts

          # Best-effort host key warm-up (do not fail the job if this times out)
          for attempt in 1 2 3; do
            if ssh-keyscan -T 10 -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/tmp/ssh-keyscan.err; then
              echo "Host key scanned on attempt $attempt"
              break
            fi
            echo "ssh-keyscan attempt $attempt failed (will still try SSH with accept-new)"
            cat /tmp/ssh-keyscan.err || true
            sleep 2
          done

      - name: Deploy to VPS
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          ssh -o BatchMode=yes "$SSH_USER@$SSH_HOST" << 'EOF'
            set -e

            cd /home/deploy/apps/school-management-backend

            echo "Updating code..."
            git fetch origin
            git reset --hard origin/main

            echo "Installing dependencies..."
            npm ci

            echo "Building..."
            npm run build

            echo "Applying database schema changes..."
            npm run db:sync-deploy

            echo "Verifying compiled application..."
            test -f dist/app.js

            echo "Restarting PM2..."
            pm2 reload school-backend || pm2 start dist/app.js --name school-backend

            pm2 save

            echo "Deployment completed successfully!"
          EOF
